<div class="boot" id="boot">
  <div class="boot-inner">
    <div class="boot-logo" aria-hidden="true">
      <span class="boot-circle"></span>
      <span class="boot-name">{{ site.data.profile.name | downcase }}<span class="boot-cursor">_</span></span>
    </div>
    <div class="boot-spinner" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <p class="boot-hint">booting portfolio<span class="boot-dots"></span></p>
  </div>
  <button class="boot-skip" data-action="skip-boot">Press to skip →</button>
</div>
