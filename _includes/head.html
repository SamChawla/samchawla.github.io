<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">

<!-- SEO: title, description, Open Graph, Twitter cards, canonical -->
{% seo %}

<!-- Social share image (explicit so cards render reliably) -->
{% assign share_image = page.image | default: site.image %}
<meta property="og:image" content="{{ share_image | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:image" content="{{ share_image | absolute_url }}">

<!-- Favicons -->
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/png" href="{{ '/assets/img/favicon-32.png' | relative_url }}" sizes="32x32">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">

<!-- Feed -->
{% feed_meta %}

<!-- Fonts: Ubuntu + Ubuntu Mono (Yaru desktop theme) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap">

<!-- Styles -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

<!-- Structured data: Person -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ site.data.profile.name | jsonify }},
  "jobTitle": {{ site.data.profile.role | jsonify }},
  "url": {{ site.url | append: site.baseurl | jsonify }},
  "image": {{ site.data.profile.avatar | jsonify }},
  "email": {{ site.author.email | prepend: "mailto:" | jsonify }},
  "sameAs": [
    {% for s in site.data.social %}{% unless s.url contains "mailto:" %}{{ s.url | jsonify }}{% unless forloop.last %},{% endunless %}{% endunless %}{% endfor %}
  ]
}
</script>
