<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body class="page">
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="page-bar">
    <a class="back" href="{{ '/' | relative_url }}">{% include appicons.html name="terminal" %} Desktop</a>
    <nav class="page-bar-links" aria-label="Site">
      <a href="{{ '/blog/' | relative_url }}">Writing</a>
      <a href="https://github.com/samchawla" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/sumit-s-chawla" target="_blank" rel="noopener">LinkedIn</a>
    </nav>
  </div>

  <main id="content">
    {{ content }}
  </main>

  <footer class="page-footer">
    &copy; {{ site.time | date: '%Y' }} {{ site.data.profile.name }} · Built with Jekyll
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
